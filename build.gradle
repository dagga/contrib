buildscript {
    repositories {
        mavenCentral()
    }
}

allprojects {
    group = 'net.i2p.contrib'
    version = '50'
}

subprojects {
    apply plugin: 'java'

    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    repositories {
        mavenCentral()
    }

    // Use traditional source directory layout
    sourceSets {
        main {
            java {
                srcDirs = ['src']
            }
        }
    }

    // Disable test tasks (no tests exist in this project)
    test {
        enabled = false
    }
}
